; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

# Options shared by all the environments
[env]
; The latest versions of the ESP32 platform are not available on the official
; platform.io project. Pull it from the pioarduino project instead (fork from
; platform.io). 
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = arduino_nano_esp32
framework = arduino
monitor_speed = 9600
; Also look for header files in the `inc` folder 
build_flags = -iquote inc 
monitor_filters =
  ; Remove typical terminal control codes from input
  default   
  ; Add timestamp with milliseconds for each new line
  time      
  ; Log data to a file “platformio-device-monitor-*.log” located in the current
  ; working directory
  log2file  
  ; Custom filter for Espressif 32 which decodes crash exception
  esp32_exception_decoder 

# Build the final project (src/main.cpp)
[env:automated_plant_watering]
lib_deps = adafruit/Adafruit SSD1306@^2.5.17
build_src_filter = 
    ; Filters are overwritten, put back the default ones
    +<*> -<.git/> -<.svn/> 
    ; Remove the sandbox folder
    -<sandbox/*> 

# Build the soil_moisture code from sandbox (sandbox/soil_moisture.cpp)
[env:sandbox_soil_moisture]
; Compile sandbox/soil_moisture.cpp instead of main.cpp
build_src_filter = 
    -<main.cpp> 
    +<sandbox/soil_moisture.cpp>
    +<utils/*>

# Build the luminosity code from sandbox (sandbox/luminosity.cpp)
[env:sandbox_luminosity]
; Compile sandbox/luminosity.cpp instead of main.cpp
build_src_filter =
    -<main.cpp>
    +<sandbox/luminosity.cpp>
    +<utils/*>

# Build the water_level code from sandbox (sandbox/water_level.cpp)
[env:sandbox_water_level]
; Compile sandbox/water_level.cpp instead of main.cpp
build_src_filter =
    -<main.cpp>
    +<sandbox/water_level.cpp>
    +<utils/*>

# Build the oled_screen code from sandbox (sandbox/oled_screen.cpp)
[env:sandbox_oled_screen]
lib_deps = adafruit/Adafruit SSD1306@^2.5.17
; Compile sandbox/oled_screen.cpp instead of main.cpp
build_src_filter =
    -<main.cpp>
    +<sandbox/oled_screen.cpp>
    +<utils/*>
